<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Détection des maladies des cultures</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-shell">
        <main class="card">
            <div class="hero">
                <h1>Détection des maladies des cultures</h1>
                <p>Choisissez une feuille puis lancez l’analyse.</p>
            </div>

            <div class="actions">
                <button id="chooseImageBtn" class="button primary">Choisir une image</button>
                <button id="analyzeBtn" class="button secondary" disabled>Analyser</button>
            </div>

            <p id="fileLabel" class="file-label hidden"></p>

            <div id="loadingState" class="loader hidden" aria-live="polite">
                <div class="spinner"></div>
                <p>Analyse en cours...</p>
            </div>

            <section id="resultCard" class="result-card hidden" aria-live="polite">
                <div class="result-block">
                    <div class="result-header">
                        <span class="result-icon">🦠</span>
                        <div>
                            <h2 id="resultName">Nom de la maladie</h2>
                            <p id="resultConfidence" class="result-confidence">Confiance</p>
                        </div>
                    </div>

                    <div class="result-section">
                        <h3>Description</h3>
                        <p id="resultDescription">-</p>
                    </div>

                    <div class="result-section">
                        <h3>Causes</h3>
                        <p id="resultCauses">-</p>
                    </div>

                    <div class="result-section">
                        <h3>Traitement</h3>
                        <p id="resultTreatment">-</p>
                    </div>

                    <button id="newAnalysisBtn" class="button primary block">Nouvelle analyse</button>
                </div>
            </section>

            <div id="errorMessage" class="error-message hidden" role="alert"></div>

            <input type="file" id="imageInput" accept="image/*" capture="environment" hidden>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
